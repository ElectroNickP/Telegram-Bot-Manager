services:
  telegram-bot-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-bot-manager:latest
    container_name: bot_manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - FLASK_DEBUG=0
      - PLUGINS_DIR=../plugins
      # Указываем путь к конфигу в volume
      - BOT_CONFIG_PATH=/app/data/bot_configs.json
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-securepassword123}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/src/backups
      # Монтируем директорию с данными, чтобы файл можно было перезаписывать атомарно
      - ./infra/data:/app/data
      - ./src/static/uploads:/app/src/static/uploads
      - ./plugins:/app/plugins
    user: appuser
    networks:
      - bot_net

networks:
  bot_net:
    driver: bridge
