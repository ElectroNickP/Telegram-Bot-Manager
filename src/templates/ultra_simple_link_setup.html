<!-- УЛЬТРА-ПРОСТОЙ ИНТЕРФЕЙС НАСТРОЙКИ КНОПОК -->
<div class="modal fade" id="ultraSimpleLinkSetupModal" tabindex="-1" aria-labelledby="ultraSimpleLinkSetupModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg">
            <!-- Простой заголовок -->
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold" id="ultraSimpleLinkSetupModalLabel">
                    ✨ Настройка умных кнопок
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>

            <div class="modal-body p-4">
                <!-- Объяснение одной строкой -->
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle"></i>
                    <strong>Как это работает:</strong> Если в ссылке есть указанный текст - она превращается в кнопку
                </div>

                <!-- Добавить новое правило -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h6 class="mb-0"><i class="fas fa-plus text-success"></i> Добавить правило</h6>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Искать в ссылке:</label>
                                <input type="text" class="form-control" id="searchInLink" 
                                       placeholder="script.google.com" />
                                <small class="text-muted">Часть ссылки для поиска</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Текст кнопки:</label>
                                <input type="text" class="form-control" id="buttonTextInput" 
                                       placeholder="📊 Открыть скрипт" />
                                <small class="text-muted">Что будет написано на кнопке</small>
                            </div>
                        </div>
                        <button type="button" class="btn btn-success mt-3 w-100" id="addSimpleRuleBtn">
                            <i class="fas fa-plus"></i> Добавить правило
                        </button>
                    </div>
                </div>

                <!-- Список активных правил -->
                <div class="card" id="activeRulesCard" style="display: none;">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="fas fa-list text-primary"></i> Активные правила</h6>
                        <button type="button" class="btn btn-outline-danger btn-sm" id="clearAllRulesBtn" title="Удалить все правила">
                            <i class="fas fa-trash"></i> Очистить все
                        </button>
                    </div>
                    <div class="card-body" id="activeRulesContainer">
                        <!-- Правила будут добавляться сюда -->
                    </div>
                </div>

                <!-- Быстрый тест -->
                <div class="card mt-4">
                    <div class="card-header bg-light">
                        <h6 class="mb-0"><i class="fas fa-flask text-warning"></i> Проверить</h6>
                    </div>
                    <div class="card-body">
                        <textarea class="form-control mb-3" id="testTextArea" rows="3" 
                                  placeholder="Вставь текст со ссылкой для проверки..."></textarea>
                        <button type="button" class="btn btn-warning w-100" id="quickTestBtn">
                            <i class="fas fa-magic"></i> Показать как будет выглядеть
                        </button>
                        <div id="testResults" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Отмена
                </button>
                <button type="button" class="btn btn-success" id="saveUltraSimpleSettings">
                    <i class="fas fa-save"></i> Сохранить
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.rule-item {
    background: linear-gradient(45deg, #28a745, #20c997);
    color: white;
    border-radius: 8px;
    margin-bottom: 10px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.rule-remove {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    cursor: pointer;
    font-size: 12px;
}

.rule-remove:hover {
    background: #dc3545;
}

/* Анимации для алертов */
@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes slideOut {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(100%);
        opacity: 0;
    }
}
</style>
