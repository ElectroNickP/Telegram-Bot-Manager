{% extends "base.html" %}

{% block title %}Login - Bot Manager{% endblock %}

{% block body %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div
        style="background: var(--bg-card); width: 100%; max-width: 400px; padding: 2.5rem; border-radius: var(--border-radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-brain" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem;"></i>
            <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem 0; color: var(--text-main);">Welcome Back
            </h1>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0;">Sign in to manage your neural bots</p>
        </div>

        {% if error %}
        <div
            style="padding: 0.75rem; border-radius: var(--border-radius); margin-bottom: 1.5rem; font-size: 0.875rem; background-color: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
